<!DOCTYPE html>
<html>

<head>

    <title>Order History</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f2f2f2;
        }

        .navbar{
            background:#333;
            padding:15px;
            text-align:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:20px;
            font-weight:bold;
        }

        h1{
            text-align:center;
            margin-top:30px;
        }

        .container{
            width:80%;
            margin:30px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        .order{
            display:flex;
            justify-content:space-between;
            padding:15px;
            border-bottom:1px solid gray;
        }

        .price{
            color:#ff5722;
            font-weight:bold;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <a href="/">Home</a>

        <a href="/viewfood">Foods</a>

        <a href="/cart">Cart</a>

        <a href="/logout">Logout</a>

    </div>

    <h1>Order History</h1>

    <div class="container">

        {% for order in orders %}

        <div class="order">

            <h3>{{ order.food_name }}</h3>

            <h3 class="price">{{ order.price }}</h3>

        </div>

        {% endfor %}

    </div>

</body>

</html>
