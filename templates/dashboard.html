<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Dashboard</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#eaeaea;
}

.navbar{
    background:#333;
    padding:20px;
    text-align:center;
}

.navbar a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:18px;
}

.dark-btn{
    padding:10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.header{
    background:#ff5722;
    color:white;
    text-align:center;
    padding:40px;
}

.container{
    width:80%;
    margin:50px auto;
    background:white;
    padding:40px;
    text-align:center;
    border-radius:10px;
}

.btn{
    display:block;
    width:250px;
    margin:20px auto;
    padding:15px;
    background:#ff5722;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

.dark-mode{
    background:#121212;
    color:white;
}

.dark-mode .container{
    background:#1e1e1e;
    color:white;
}

.dark-mode .navbar{
    background:black;
}

.dark-mode .header{
    background:#222;
}

@media(max-width:768px){

    .container{
        width:90%;
        padding:20px;
    }

    .navbar a{
        display:block;
        margin:10px 0;
    }

    .btn{
        width:100%;
        box-sizing:border-box;
    }

}

</style>

</head>

<body>

<div class="navbar">

    <a href="/">Home</a>

    {% if session.get('role') == 'admin' %}
    <a href="/addfood">Add Food</a>
    {% endif %}

    <a href="/viewfood">View Food</a>

    <a href="/logout">Logout</a>

    <button onclick="toggleDarkMode()"
            class="dark-btn">

        Dark Mode

    </button>

</div>

<div class="header">

    <h1>Food Ordering Dashboard</h1>

</div>

<div class="container">

    <h1>Welcome User!</h1>

    <a href="/viewfood" class="btn">

        View Foods

    </a>

    <a href="/orderhistory" class="btn">

        Order History

    </a>

    <a href="/profile" class="btn">

        User Profile

    </a>

    {% if session.get('role') == 'admin' %}

    <a href="/adminorders" class="btn">

        Manage Orders

    </a>

    {% endif %}

</div>

<script>

function toggleDarkMode(){

    document.body.classList.toggle('dark-mode');

}

</script>

</body>

</html>
