<!DOCTYPE html>
<html>

<head>

    <title>Admin Orders</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f2f2f2;
        }

        .navbar{
            background:#333;
            padding:15px;
            text-align:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:20px;
            font-weight:bold;
        }

        h1{
            text-align:center;
            margin-top:30px;
        }

        .container{
            width:80%;
            margin:30px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        .order{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px;
            border-bottom:1px solid gray;
        }

        .price{
            color:#ff5722;
            font-weight:bold;
        }

        .btn{
            padding:8px 15px;
            background:red;
            color:white;
            text-decoration:none;
            border-radius:5px;
        }

    </style>

</head>

<body>

{% with messages = get_flashed_messages() %}
    {% if messages %}

        {% for message in messages %}

            <div style="
                background:lightgreen;
                padding:15px;
                text-align:center;
                margin:10px;
                font-weight:bold;
            ">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}
{% endwith %}

    <div class="navbar">

        <a href="/">Home</a>

        <a href="/dashboard">Dashboard</a>

        <a href="/viewfood">Foods</a>

        <a href="/logout">Logout</a>

    </div>

    <h1>Admin Order Management</h1>

    <div class="container">

        {% for order in orders %}

        <div class="order">

            <h3>{{ order.food_name }}</h3>

            <h3 class="price">{{ order.price }}</h3>

            <a href="/deleteorder/{{ order.id }}"
               class="btn">

               Delete

            </a>

        </div>

        {% endfor %}

    </div>

</body>

</html>
