<!DOCTYPE html>
<html>

<head>

    <title>Payment</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f2f2f2;
        }

        .navbar{
            background:#333;
            padding:15px;
            text-align:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:20px;
            font-weight:bold;
        }

        .container{
            width:50%;
            margin:40px auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 10px gray;
        }

        h1{
            text-align:center;
            color:#ff5722;
        }

        .total{
            text-align:center;
            font-size:30px;
            margin:20px;
            font-weight:bold;
        }

        .payment-box{
            margin-top:30px;
        }

        .payment-option{
            margin:15px 0;
            padding:15px;
            border:1px solid gray;
            border-radius:10px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
        }

        .btn{
            display:block;
            width:100%;
            margin-top:30px;
            padding:15px;
            background:#ff5722;
            color:white;
            border:none;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <a href="/">Home</a>

        <a href="/viewfood">Foods</a>

        <a href="/cart">Cart</a>

        <a href="/logout">Logout</a>

    </div>

    <div class="container">

        <h1>Payment Page</h1>

        <div class="total">

            Total Amount: ₹{{ total }}

        </div>

        <div class="payment-box">

            <div class="payment-option">

                <h3>Cash On Delivery</h3>

                <input type="radio" name="payment">

            </div>

            <div class="payment-option">

                <h3>UPI Payment</h3>

                <input type="text"
                       placeholder="Enter UPI ID">

            </div>

            <div class="payment-option">

                <h3>Card Payment</h3>

                <input type="text"
                       placeholder="Card Number">

                <input type="text"
                       placeholder="Expiry Date">

                <input type="text"
                       placeholder="CVV">

            </div>

            <a href="/placeorder">

                <button class="btn">

                    Pay Now

                </button>

            </a>

        </div>

    </div>

</body>

</html>
