<!DOCTYPE html>
<html>

<head>

    <title>User Profile</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f2f2f2;
        }

        .navbar{
            background:#333;
            padding:15px;
            text-align:center;
        }

        .navbar a{
            color:white;
            text-decoration:none;
            margin:20px;
            font-weight:bold;
        }

        .container{
            width:50%;
            margin:60px auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 10px gray;
            text-align:center;
        }

        h1{
            color:#ff5722;
        }

        .info{
            margin-top:30px;
            font-size:22px;
        }

        .label{
            font-weight:bold;
            color:#333;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <a href="/">Home</a>

        <a href="/dashboard">Dashboard</a>

        <a href="/viewfood">Foods</a>

        <a href="/orderhistory">Orders</a>

        <a href="/logout">Logout</a>

    </div>

    <div class="container">

        <h1>User Profile</h1>

        <div class="info">

            <p>
                <span class="label">Username:</span>
                {{ user.username }}
            </p>

            <p>
                <span class="label">Email:</span>
                {{ user.email }}
            </p>

            <p>
                <span class="label">Role:</span>
                {{ user.role }}
            </p>

        </div>

    </div>

</body>

</html>
