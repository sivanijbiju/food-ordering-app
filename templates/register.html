<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>
        body{
            font-family: Arial;
            background:#f2f2f2;
        }

        .container{
            width:350px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:20px;
            background:#ff5722;
            color:white;
            border:none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Register</h2>

    <form method="POST">

        <input type="text" name="username" placeholder="Username" required>

        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <select name="role"
                style="
                    width:100%;
                    padding:10px;
                    margin-top:10px;
                ">

            <option value="user">User</option>

            <option value="admin">Admin</option>

        </select>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
</html>
